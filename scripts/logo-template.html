<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: transparent;
      display: inline-flex;
      align-items: center;
      padding: 24px 32px;
    }
    .logo-container {
      display: inline-flex;
      align-items: center;
      gap: 16px;
    }
    .badge {
      background-color: #F4ED36;
      border: 4px solid #1A1A1A;
      border-radius: 12px;
      padding: 8px 24px 10px 24px;
      box-shadow: 5px 5px 0px #1A1A1A;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .brand-title {
      font-family: 'Archivo Black', sans-serif;
      font-size: 48px;
      line-height: 1.1;
      letter-spacing: -0.5px;
      text-transform: uppercase;
      color: #1A1A1A;
    }
    .hub {
      color: #C94245;
    }
    .pill {
      font-family: 'JetBrains Mono', monospace;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #F9F5F2;
      background-color: #1A1A1A;
      padding: 6px 18px 8px 18px;
      border-radius: 9999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>
  <div class="logo-container" id="logo">
    <div class="badge">
      <span class="brand-title">REUSE<span class="hub">HUB</span></span>
    </div>
    <span class="pill">CIRCULARITY</span>
  </div>
</body>
</html>
